# One-time: mirror the live Webflow site (HTML, CSS, JS, images, fonts)
# into webflow-snapshot/ so the Astro rebuild has exact copy and assets.
name: Snapshot Webflow site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror site and assets
        run: |
          set -eux
          rm -rf webflow-snapshot && mkdir -p webflow-snapshot && cd webflow-snapshot
          # Pages + everything they load, including assets on Webflow's CDNs
          wget --mirror --page-requisites --convert-links --adjust-extension \
               --no-parent --span-hosts \
               --domains=glowinthedirt.com,www.glowinthedirt.com,cdn.prod.website-files.com,uploads-ssl.webflow.com,assets-global.website-files.com \
               --reject-regex '.*\?.*' \
               -e robots=off --wait=0.2 --tries=3 \
               https://www.glowinthedirt.com/ \
               https://www.glowinthedirt.com/work \
               https://www.glowinthedirt.com/space || true
          # Also keep raw (unconverted) HTML for each page, for parsing
          mkdir -p raw
          for p in "" work space $(grep -oh 'href="/work/[a-z0-9-]*"' -r www.glowinthedirt.com 2>/dev/null | sed 's/href="\/work\///;s/"//' | sort -u | sed 's/^/work\//'); do
            name=$(echo "${p:-index}" | tr '/' '_')
            curl -sSL "https://www.glowinthedirt.com/$p" -o "raw/$name.html" || true
          done
          # Full-size originals for every image referenced anywhere
          grep -ohE 'https://(cdn\.prod\.website-files\.com|uploads-ssl\.webflow\.com|assets-global\.website-files\.com)/[^"'"'"' )]+\.(jpe?g|png|gif|webp|svg|avif|mp4|webm)' -r raw | sort -u > image-urls.txt
          mkdir -p originals
          while read -r u; do
            f="originals/$(echo "$u" | sed -E 's#https://[^/]+/##; s#/#__#g')"
            curl -sSL "$u" -o "$f" || true
          done < image-urls.txt
          du -sh . ; find . -type f | wc -l

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -B webflow-snapshot
          git add webflow-snapshot
          git commit -m "Snapshot of live Webflow site" || echo "nothing to commit"
          git push -f origin webflow-snapshot
